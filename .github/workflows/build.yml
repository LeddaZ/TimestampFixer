name: Build

# Builds the standalone app for every supported system. Publishing a release
# attaches the builds to it; a manual run only keeps them as workflow artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: macos, arch: amd64, runner: macos-15-intel }
          - { os: macos, arch: arm64, runner: macos-15 }
          # A Linux build only runs on systems whose glibc is at least as new
          # as the runner's, so each uses the oldest image the PyQt6 wheels
          # allow: they need glibc 2.34 on amd64 and 2.39 on arm64.
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    env:
      ASSET: TimestampFixer-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      # PyInstaller bundles the libraries Qt's X11 plugin links against, but
      # only the ones present on the build machine.
      - name: Install Qt system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest test_timestamp_parser

      - name: Build
        run: python -m PyInstaller --noconfirm TimestampFixer.spec

      - name: Package (Windows)
        if: matrix.os == 'windows'
        run: mv dist/TimestampFixer.exe "$ASSET.exe"

      # tar keeps the executable bit, which a bare upload would lose.
      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: tar -czf "$ASSET.tar.gz" -C dist TimestampFixer

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TimestampFixer.app "$ASSET.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*
          if-no-files-found: error

  release:
    name: Attach builds to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" builds/* --clobber
